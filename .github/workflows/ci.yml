name: BrainCX CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    name: Backend Test Suite (Python 3.11)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest suite
        run: |
          cd backend
          pytest -v tests/
        env:
          ENVIRONMENT: test
          TIMEZONE_DEFAULT: America/New_York
          CREATE_GOOGLE_MEET_LINK: true

  frontend-build:
    name: Frontend Build & Lint (Next.js)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm install


      - name: Build Next.js application
        run: |
          cd frontend
          npm run build
        env:
          NEXT_PUBLIC_VAPI_PUBLIC_KEY: mock-public-key
          NEXT_PUBLIC_VAPI_ASSISTANT_ID: mock-assistant-id
          NEXT_PUBLIC_API_BASE_URL: https://api.braincx.ai

  docker-build:
    name: Docker Container Build
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build backend container image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: braincx-voice-agent-backend:test
